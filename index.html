<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="color-scheme" content="light" />

    <meta name="author" content="Rian Hussain" />
    <!-- Favicon set generated from the RH monogram mark. Transparent corners on
         the .ico/.png so the disc sits cleanly in a browser tab; the iOS icon is
         full-bleed because iOS masks it to a rounded rectangle. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- route:meta:start
         This block is the homepage's metadata. scripts/prerender-routes.ts
         rewrites it per project to emit real /work/<slug>/ pages that each
         carry their own title, description, canonical and share card. The
         markers are load-bearing — the build fails without them. -->
    <title>Rian Hussain — AI/ML Engineer &amp; Product Builder</title>
    <meta
      name="description"
      content="Applied AI, computer vision and product engineering — ErgoVigilance, MarmaAI and Kisan360, plus an Honorable Proposal at the Global Development Public Policy Youth Innovation Contest Finals 2026."
    />
    <link rel="canonical" href="https://rianportfolio.netlify.app/" />

    <!-- Open Graph: absolute URLs, served statically so crawlers need no JavaScript -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rianportfolio.netlify.app/" />
    <meta property="og:site_name" content="Rian Hussain" />
    <meta property="og:title" content="Rian Hussain — AI/ML Engineer &amp; Product Builder" />
    <meta
      property="og:description"
      content="Applied AI, computer vision and product engineering — ErgoVigilance, MarmaAI and Kisan360, plus an Honorable Proposal at the Global Development Public Policy Youth Innovation Contest Finals 2026."
    />
    <meta property="og:image" content="https://rianportfolio.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rian Hussain — AI/ML Engineer and Product Builder. ErgoVigilance, MarmaAI and Kisan360. Applied AI, computer vision and product engineering."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rian Hussain — AI/ML Engineer &amp; Product Builder" />
    <meta
      name="twitter:description"
      content="Applied AI, computer vision and product engineering — ErgoVigilance, MarmaAI and Kisan360, plus an Honorable Proposal at the Global Development Public Policy Youth Innovation Contest Finals 2026."
    />
    <meta name="twitter:image" content="https://rianportfolio.netlify.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Rian Hussain — AI/ML Engineer and Product Builder. ErgoVigilance, MarmaAI and Kisan360."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
