# Netlify build and serving rules for the portfolio.
#
# The site is a single-page app, but every project also gets a real route
# (/work/<slug>/) written by scripts/prerender-routes.ts during the build, so
# link previews and crawlers get their own title, description and share card.
# Anything that does not exist is served public/404.html with a 404 status.

[build]
  command = "npm run build"
  publish = "dist"

# Accept the no-slash form as well, whatever the Pretty URLs setting is.
[[redirects]]
  from = "/work/:slug"
  to = "/work/:slug/"
  status = 301

# Hashed build output is immutable and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML that references those hashes must always be revalidated, otherwise a
# deploy can serve markup pointing at assets that no longer exist.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
